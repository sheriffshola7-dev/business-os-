name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package source ZIP
        run: git archive --format=zip --output=business-os-preview.zip HEAD
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: business-os-preview
          path: business-os-preview.zip
          retention-days: 7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run production build
        run: npm run build
